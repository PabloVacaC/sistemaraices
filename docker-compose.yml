services:
  # 1. Base de Datos PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: raices_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: sistemraices_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistemraices_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - raices_net

  # 2. Backend FastAPI
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: raices_backend
    restart: always
    environment:
      APP_NAME: SISTEMAS_RAICES
      DATABASE_URL: postgresql+psycopg://postgres:1234@db:5432/sistemraices_db
      JWT_SECRET_KEY: QpJ5nbWbfUVcPNo7uVEDGWsGRNsS7ruIHAK8W5nr-8Ks1vdhBgSDkbYJZ4XztZjM
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - raices_net

  # 3. Frontend Angular + Nginx
  frontend:
    build:
      context: ./Frontend/raices-web
      dockerfile: Dockerfile
    container_name: raices_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - raices_net

volumes:
  postgres_data:
    driver: local

networks:
  raices_net:
    driver: bridge
